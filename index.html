<body>
  <div class="app studio">
    <header class="top">
      <div class="brand">
        <span class="seal-mini" aria-hidden="true">墨</span>
        <div>
          <h1>Moying</h1>
          <p>English in brush style</p>
        </div>
      </div>
    </header>

    <div class="workspace">
      <section class="stage-wrap">
        <canvas id="stage" width="900" height="1200"></canvas>
        <div id="loading" class="loading" role="status">Loading brush…</div>
      </section>

      <section class="panel">
        <div class="lead">
          <label class="field">
            <span class="field-head">
              <span>Your word or name</span>
              <span id="charCount" aria-live="polite">5/16</span>
            </span>
            <input id="textInput" type="text" value="Peace" placeholder="Peace, Emma, Love…" autocomplete="off" enterkeyhint="done" />
          </label>
          <p id="charHint" class="hint warn" hidden></p>
          <p id="limitHint" class="hint" hidden>16 character limit.</p>
          <button id="btnPay" class="pay" type="button">Remove watermark · $1.99</button>
          <p class="hint price">Free watermarked preview. $1.99 once for a clean high-resolution download. No subscription.</p>
        </div>
        <div class="more">
        <div class="seg seg-wide" data-name="fmt" id="fmtBar" role="group" aria-label="Export format">
          <button type="button" data-v="png" class="on">PNG</button>
          <button type="button" data-v="jpg">JPG</button>
          <button type="button" data-v="webp">WebP</button>
          <button type="button" data-v="alpha">Transparent PNG</button>
          <button type="button" data-v="svg">SVG</button>
          <button type="button" data-v="pdf">PDF</button>
        </div>
        <button id="btnExport" class="secondary" type="button">Export</button>
        <p class="hint">Free downloads: 900×1200 watermarked preview</p>

        <div class="seg seg-wide" data-name="style" role="group" aria-label="Brush style">
          <button type="button" data-v="gong">Neat</button>
          <button type="button" data-v="kai" class="on">Regular</button>
          <button type="button" data-v="xing">Flowing</button>
          <button type="button" data-v="cao">Grass</button>
          <button type="button" data-v="kuang">Wild</button>
        </div>
        <div class="row">
          <div class="seg" data-name="dir" role="group" aria-label="Direction">
            <button type="button" data-v="h" class="on">Horizontal</button>
            <button type="button" data-v="v">Vertical</button>
          </div>
        </div>

        <div class="row">
          <div class="seg" data-name="paper" role="group" aria-label="Paper">
            <button type="button" data-v="xuan" class="on">Rice</button>
            <button type="button" data-v="aged">Aged</button>
            <button type="button" data-v="night">Night</button>
          </div>
          <div class="seg" data-name="ink" role="group" aria-label="Ink">
            <button type="button" data-v="black" class="on">Ink</button>
            <button type="button" data-v="cinnabar">Cinnabar</button>
          </div>
        </div>

        <label class="slider">
          <span>Size</span>
          <input id="size" type="range" min="90" max="260" value="196" />
        </label>
        <label class="slider">
          <span>Space</span>
          <input id="track" type="range" min="0" max="80" value="38" />
        </label>
        <label class="slider">
          <span>Dry</span>
          <input id="dry" type="range" min="0" max="80" value="22" />
        </label>

        <label class="check">
          <input id="sealOn" type="checkbox" checked />
          <span>Red seal</span>
        </label>

        <p class="hint muted">Short words look best.</p>
        </div>
      </section>
    </div>
